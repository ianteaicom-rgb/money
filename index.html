<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>火星人的便當 · 財經與投資導航儀表板</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-body: #0b0f17;
      --bg-sidebar: #111827;
      --bg-header: #131b2c;
      --bg-card: #162032;
      --bg-card-hover: #1e2c44;
      --border: #223048;
      --border-highlight: #38bdf8;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --text-muted: #64748b;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.2);
      --amber: #f59e0b;
      --amber-bg: rgba(245, 158, 11, 0.12);
      --amber-border: rgba(245, 158, 11, 0.35);
      --green: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 頂部固定狀態列 (雙時區 + 快捷) */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 48px;
      background: var(--bg-header);
      border-bottom: 1px solid var(--border);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }
    .top-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 15px;
      color: #fff;
    }
    .clocks-wrap {
      display: flex;
      gap: 16px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      background: #0b0f17;
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }
    .clock-item { display: flex; align-items: center; gap: 6px; }
    .clock-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }

    /* 佈局容器 */
    .layout-wrapper {
      display: flex;
      width: 100%;
      margin-top: 48px;
    }

    /* 左側清單目錄 (Sidebar) */
    aside.sidebar {
      width: 300px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      position: fixed;
      top: 48px;
      bottom: 0;
      left: 0;
      overflow-y: auto;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      z-index: 40;
    }

    /* 左上角特製：火星人的便當沙龍卡片 */
    .salon-card {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.15) 0%, rgba(217, 119, 6, 0.25) 100%);
      border: 1px solid var(--amber-border);
      border-radius: 10px;
      padding: 14px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.08);
    }
    .salon-card:hover {
      border-color: var(--amber);
      box-shadow: 0 4px 16px rgba(245, 158, 11, 0.25);
      transform: translateY(-1px);
    }
    .salon-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(245, 158, 11, 0.25);
      color: #fbbf24;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 12px;
      width: fit-content;
    }
    .salon-title {
      font-size: 15px;
      font-weight: 700;
      color: #fef08a;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .salon-desc {
      font-size: 12px;
      color: #cbd5e1;
      line-height: 1.4;
    }

    /* 側邊欄過濾輸入框 */
    .sidebar-filter {
      position: relative;
    }
    .sidebar-input {
      width: 100%;
      background: #0b0f17;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      color: #fff;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    .sidebar-input:focus { border-color: var(--accent); }

    /* 目錄分組 */
    .nav-group-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      margin: 10px 0 6px 4px;
    }
    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .nav-item-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 7px 10px;
      border-radius: 6px;
      color: var(--text-sub);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      background: transparent;
      border: none;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
    }
    .nav-item-btn:hover {
      background: #1b263a;
      color: #fff;
    }
    .nav-item-btn .outlink {
      font-size: 11px;
      color: var(--text-muted);
      opacity: 0;
      transition: opacity 0.15s;
    }
    .nav-item-btn:hover .outlink { opacity: 1; color: var(--accent); }

    /* 右側主要內容區 */
    main.content {
      margin-left: 300px;
      flex: 1;
      padding: 24px 32px 60px;
      min-height: calc(100vh - 48px);
    }

    /* 頂部搜尋與分類按鈕 */
    .header-section {
      margin-bottom: 24px;
    }
    .search-row {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .main-search-input {
      flex: 1;
      min-width: 280px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 14px;
      color: #fff;
      outline: none;
      transition: all 0.2s;
    }
    .main-search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .tabs-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .filter-tab {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-sub);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }
    .filter-tab:hover { color: #fff; border-color: var(--accent); }
    .filter-tab.active {
      background: var(--accent);
      color: #0b0f17;
      font-weight: 700;
      border-color: var(--accent);
    }

    /* 卡片網格 */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 18px;
    }
    .site-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      position: relative;
    }
    .site-card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
      box-shadow: 0 8px 24px var(--accent-glow);
      background: var(--bg-card-hover);
    }
    .site-card.target-highlight {
      border-color: #38bdf8 !important;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.35), 0 8px 24px rgba(56, 189, 248, 0.3) !important;
      animation: pulseHighlight 1.5s ease-out;
    }
    @keyframes pulseHighlight {
      0% { transform: scale(1.02); }
      50% { transform: scale(1.02); }
      100% { transform: scale(1); }
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
      gap: 8px;
    }
    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
    }
    .card-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .card-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 4px;
      white-space: nowrap;
    }
    .badge-official { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
    .badge-realtime { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .badge-finance  { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-news     { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-global   { background: rgba(139, 92, 246, 0.2); color: #a78bfa; border: 1px solid rgba(139, 92, 246, 0.3); }

    .star-btn {
      background: transparent;
      border: none;
      color: #475569;
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
      padding: 2px;
      transition: color 0.15s;
    }
    .star-btn:hover, .star-btn.active { color: #f59e0b; }

    .card-body {
      font-size: 13px;
      color: var(--text-sub);
      line-height: 1.5;
      margin-bottom: 14px;
      flex-grow: 1;
    }
    .card-foot {
      border-top: 1px dashed var(--border);
      padding-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
    }
    .card-feature {
      color: var(--accent);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .card-open {
      color: var(--text-muted);
      font-size: 11px;
    }
    .site-card:hover .card-open { color: var(--accent); }

    /* 空狀態 */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      grid-column: 1 / -1;
      display: none;
    }

    /* RWD 漢堡選單 */
    .menu-toggle {
      display: none;
      background: transparent;
      border: 1px solid var(--border);
      color: #fff;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }

    @media (max-width: 860px) {
      aside.sidebar {
        transform: translateX(-100%);
        transition: transform 0.25s ease;
      }
      aside.sidebar.open {
        transform: translateX(0);
      }
      main.content {
        margin-left: 0;
        padding: 16px;
      }
      .menu-toggle { display: block; }
    }
  </style>
</head>
<body>

  <!-- 頂部固定狀態列 -->
  <div class="top-bar">
    <div class="top-brand">
      <button class="menu-toggle" id="menuToggle" onclick="toggleSidebar()">☰ 目錄</button>

    </div>
    <div class="clocks-wrap">
      <div class="clock-item"><span class="clock-dot"></span> 台北: <span id="clock-tw">--:--:--</span></div>
      <div class="clock-item"><span class="clock-dot" style="background:#38bdf8;"></span> 紐約: <span id="clock-ny">--:--:--</span></div>
    </div>
  </div>

  <div class="layout-wrapper">
    <!-- 左側總清單目錄 (Sidebar) -->
    <aside class="sidebar" id="sidebar">
      <!-- 左上角：火星人的便當基地 -->
      <a href="https://vocus.cc/salon/6a80591abc13239b2cad93c5" target="_blank" rel="noopener noreferrer" class="salon-card">

        <div class="salon-title">火星人的便當 <span>↗</span></div>

      </a>

      <!-- 快速過濾 -->
      <div class="sidebar-filter">
        <input type="text" id="sideFilter" class="sidebar-input" placeholder="🔍 側欄快速搜尋站名..." oninput="filterSidebar(this.value)">
      </div>

      <!-- 分類清單 -->
      <div id="sidebarMenu"></div>
    </aside>

    <!-- 右側主要內容區 (Main Content) -->
    <main class="content">
      <div class="header-section">
        <div class="search-row">
          <input type="text" id="mainSearch" class="main-search-input" placeholder="🔍 搜尋網站名稱、功能或關鍵字（如：月營收、VIX、三大法人、殖利率、期貨）...">

        <div class="tabs-wrap" id="categoryTabs">

          <button class="filter-tab" data-cat="realtime">⚡ 即時看盤熱度 (4)</button>
          <button class="filter-tab" data-cat="finance">📊 基本面與籌碼 (3)</button>
          <button class="filter-tab" data-cat="news">📰 產業趨勢新聞 (3)</button>
          <button class="filter-tab" data-cat="global">🌐 全球總經美股 (3)</button>
        </div>
      </div>

      <!-- 卡片網格 -->
      <div class="cards-grid" id="cardsGrid"></div>
      <div class="empty-state" id="emptyState">
        <p style="font-size: 16px; margin-bottom: 6px;">查無符合的網站</p>
        <p style="font-size: 13px;">請嘗試更換搜尋關鍵字或切換分類標籤。</p>
      </div>
    </main>
  </div>

        bClass: "badge-news",
        desc: "嘉實資訊旗下資深財經網站，其「產業知識庫」將全球與台灣產業鏈上下游梳理得最清楚。",
        feature: "產業上下游關聯圖、概念股清單、營收比重"
      },
      {
        id: "digitimes",
        name: "DIGITIMES 電子時報",
        url: "https://www.digitimes.com.tw",
        cat: "news",
        badge: "科技權威",
        bClass: "badge-news",
        desc: "專注科技硬體、半導體晶圓代工與先進封裝供應鏈的權威調研媒體，深度洞察產業景氣。",
        feature: "先進封裝/AI伺服器供應鏈動態、晶圓產能利用率"
      },

      // 全球總經與美股觀測
      {
        id: "macromicro",
        name: "財經 M 平方",
        url: "https://www.macromicro.me",
        cat: "global",
        badge: "總經權威",
        bClass: "badge-global",
        desc: "華人圈最優質的總體經濟圖表研究平台，用數據圖表看清景氣循環週期與央行貨幣政策。",
        feature: "聯準會利率點陣圖、CPI通膨、全球製造業PMI"
      },
      {
        id: "finviz",
        name: "Finviz",
        url: "https://finviz.com",
        cat: "global",
        badge: "美股熱力圖",
        bClass: "badge-global",
        desc: "美股投資必看網站，其標普 500 熱力圖（S&P 500 Map）能在一秒內掌握全美各板塊強弱。",
        feature: "S&P 500 熱力圖、美股板塊即時漲跌、形態篩選"
      },
      {
        id: "investing",
        name: "Investing.com",
        url: "https://tw.investing.com",
        cat: "global",
        badge: "全球金融",
        bClass: "badge-global",
        desc: "夜間與開盤前必看的全球金融入口，全面涵蓋美股夜盤期貨、美債殖利率與原油大宗商品。",
        feature: "小道瓊/小那期指、美債10年期殖利率、美元指數"
      }
    ];

    const categoryNames = {
      official: "🏛️ 官方第一手",
      realtime: "⚡ 即時看盤熱度",
      finance: "📊 基本面與籌碼",
      news: "📰 產業趨勢新聞",
      global: "🌐 全球總經美股"
    };

    // 收藏機制
    let favorites = JSON.parse(localStorage.getItem('mars_fav_sites_v2') || '[]');

    function updateFavCount() {
      document.getElementById('favCount').innerText = favorites.length;
    }

    function toggleFavorite(id, e) {
      if (e) {
        e.preventDefault();
        e.stopPropagation();
      }
      if (favorites.includes(id)) {
        favorites = favorites.filter(item => item !== id);
      } else {
        favorites.push(id);
      }
      localStorage.setItem('mars_fav_sites_v2', JSON.stringify(favorites));
      updateFavCount();
      renderCards();
      renderSidebarMenu();
    }

    // 渲染左側目錄
    function renderSidebarMenu(filterTxt = '') {
      const menuEl = document.getElementById('sidebarMenu');
      const q = filterTxt.toLowerCase().trim();
      let html = '';

      const cats = ['official', 'realtime', 'finance', 'news', 'global'];
      cats.forEach(c => {
        const groupSites = sites.filter(s => s.cat === c && (!q || s.name.toLowerCase().includes(q) || s.feature.toLowerCase().includes(q)));
        if (groupSites.length > 0) {
          html += `<div class="nav-group-title">${categoryNames[c]}</div><ul class="nav-list">`;
          groupSites.forEach(s => {
            const isFav = favorites.includes(s.id);
            html += `
              <li>
                <button class="nav-item-btn" onclick="scrollToSite('${s.id}')">
                  <span>${isFav ? '⭐ ' : ''}${s.name.split(' ')[0]}</span>
                  <a href="${s.url}" target="_blank" rel="noopener noreferrer" class="outlink" onclick="event.stopPropagation()">↗</a>
                </button>
              </li>
            `;
          });
          html += `</ul>`;
        }
      });

      menuEl.innerHTML = html;
    }

    function filterSidebar(val) {
      renderSidebarMenu(val);
    }

    // 平滑滾動並高亮卡片
    function scrollToSite(id) {
      // 確保分類設為 all 以防目標卡片被隱藏
      if (currentCat !== 'all' && currentCat !== 'favorites') {
        currentCat = 'all';
        document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
        document.querySelector('.filter-tab[data-cat="all"]').classList.add('active');
        renderCards();
      }

      const card = document.getElementById(`card-${id}`);
      if (card) {
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        card.classList.add('target-highlight');
        setTimeout(() => {
          card.classList.remove('target-highlight');
        }, 1800);
      }
    }

    // 渲染右側卡片
    let currentCat = 'all';
    let searchQuery = '';

    function renderCards() {
      const grid = document.getElementById('cardsGrid');
      const emptyState = document.getElementById('emptyState');

      const filtered = sites.filter(s => {
        const matchesCat = (currentCat === 'all') || 
                           (currentCat === 'favorites' && favorites.includes(s.id)) || 
                           (s.cat === currentCat);
        const q = searchQuery.toLowerCase().trim();
        const matchesSearch = !q || 
                              s.name.toLowerCase().includes(q) || 
                              s.desc.toLowerCase().includes(q) || 
                              s.feature.toLowerCase().includes(q);
        return matchesCat && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '';
        emptyState.style.display = 'block';
        return;
      }

      emptyState.style.display = 'none';
      grid.innerHTML = filtered.map(s => {
        const isFav = favorites.includes(s.id);
        return `
          <a href="${s.url}" target="_blank" rel="noopener noreferrer" class="site-card" id="card-${s.id}">
            <div>
              <div class="card-head">
                <span class="card-title">${s.name}</span>
                <div class="card-actions">
                  <span class="card-badge ${s.bClass}">${s.badge}</span>
                  <button class="star-btn ${isFav ? 'active' : ''}" onclick="toggleFavorite('${s.id}', event)" title="收藏此站">
                    ${isFav ? '★' : '☆'}
                  </button>
                </div>
              </div>
              <p class="card-body">${s.desc}</p>
            </div>
            <div class="card-foot">
              <span class="card-feature">💡 ${s.feature}</span>
              <span class="card-open">開啟 ↗</span>
            </div>
          </a>
        `;
      }).join('');
    }

    // 事件監聽：搜尋
    document.getElementById('mainSearch').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderCards();
    });

    // 事件監聽：分類切換
    document.getElementById('categoryTabs').addEventListener('click', (e) => {
      if (e.target.tagName === 'BUTTON') {
        document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentCat = e.target.dataset.cat;
        renderCards();
      }
    });

    // 行動版側邊欄開關
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
    }

    // 初始載入
    updateFavCount();
    renderSidebarMenu();
    renderCards();
  </script>
</body>
</html>
