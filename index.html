<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>火星人的便當 · 財經與投資導航儀表板</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-body: #0b0f17;
      --bg-sidebar: #111827;
      --bg-header: #131b2c;
      --bg-card: #162032;
      --bg-card-hover: #1e2c44;
      --border: #223048;
      --border-highlight: #38bdf8;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --text-muted: #64748b;
      --accent: #38bdf8;
      --accent-glow: rgba(56, 189, 248, 0.2);
      --amber: #f59e0b;
      --amber-bg: rgba(245, 158, 11, 0.12);
      --amber-border: rgba(245, 158, 11, 0.35);
      --green: #10b981;
      --purple: #a855f7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-body);
      color: var(--text-main);
      display: flex;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* 頂部固定狀態列 */
    .top-bar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: 48px;
      background: var(--bg-header);
      border-bottom: 1px solid var(--border);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
    }
    .top-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 15px;
      color: #fff;
    }
    .top-right-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .clocks-wrap {
      display: flex;
      gap: 14px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      background: #0b0f17;
      padding: 4px 12px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }
    .clock-item { display: flex; align-items: center; gap: 6px; }
    .clock-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); }

    /* 佈局容器 */
    .layout-wrapper {
      display: flex;
      width: 100%;
      margin-top: 48px;
    }

    /* 左側清單目錄 (Sidebar) */
    aside.sidebar {
      width: 310px;
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      position: fixed;
      top: 48px;
      bottom: 0;
      left: 0;
      overflow-y: auto;
      padding: 16px 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      z-index: 40;
    }

    /* 左上角特製：火星人的便當沙龍卡片 */
    .salon-card {
      background: linear-gradient(135deg, rgba(245, 158, 11, 0.15) 0%, rgba(217, 119, 6, 0.25) 100%);
      border: 1px solid var(--amber-border);
      border-radius: 10px;
      padding: 12px 14px;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      gap: 4px;
      transition: all 0.2s ease;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.08);
    }
    .salon-card:hover {
      border-color: var(--amber);
      box-shadow: 0 4px 16px rgba(245, 158, 11, 0.25);
      transform: translateY(-1px);
    }
    .salon-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: rgba(245, 158, 11, 0.25);
      color: #fbbf24;
      font-size: 11px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 12px;
      width: fit-content;
    }
    .salon-title {
      font-size: 14px;
      font-weight: 700;
      color: #fef08a;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .salon-desc {
      font-size: 11px;
      color: #cbd5e1;
      line-height: 1.35;
    }

    /* 觀賞者榮譽徽章卡片 (Honor Rank System) */
    .honor-card {
      background: linear-gradient(135deg, #162032 0%, #1a273e 100%);
      border: 1px solid #2e3e5c;
      border-radius: 10px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      position: relative;
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.25);
    }
    .honor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .honor-tag {
      font-size: 11px;
      font-weight: 700;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.15);
      padding: 2px 7px;
      border-radius: 4px;
      border: 1px solid rgba(56, 189, 248, 0.3);
    }
    .honor-btn-rule {
      font-size: 11px;
      color: var(--text-muted);
      background: transparent;
      border: none;
      cursor: pointer;
      text-decoration: underline;
    }
    .honor-btn-rule:hover { color: var(--accent); }

    .honor-rank-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .honor-badge-icon {
      width: 38px;
      height: 38px;
      border-radius: 8px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      box-shadow: 0 0 10px rgba(56, 189, 248, 0.35);
      flex-shrink: 0;
    }
    .honor-details {
      flex: 1;
      min-width: 0;
    }
    .honor-level-title {
      font-size: 14px;
      font-weight: 700;
      color: #fff;
      display: flex;
      align-items: baseline;
      gap: 6px;
    }
    .honor-lvl-num {
      color: #38bdf8;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
    }
    .honor-exp-text {
      font-size: 11px;
      color: var(--text-sub);
      font-family: 'JetBrains Mono', monospace;
      margin-top: 2px;
    }

    .honor-progress-bar {
      width: 100%;
      height: 6px;
      background: #0b0f17;
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid #223048;
    }
    .honor-progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #38bdf8, #a855f7);
      transition: width 0.3s ease;
    }

    .honor-action-row {
      display: flex;
      gap: 6px;
      margin-top: 2px;
    }
    .btn-checkin {
      flex: 1;
      background: #2563eb;
      color: #fff;
      border: 1px solid #3b82f6;
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      text-align: center;
    }
    .btn-checkin:hover:not(:disabled) {
      background: #1d4ed8;
      box-shadow: 0 0 8px rgba(59, 130, 246, 0.4);
    }
    .btn-checkin:disabled {
      background: #1e293b;
      color: #64748b;
      border-color: #334155;
      cursor: not-allowed;
    }
    .btn-read-exp {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 11px;
      font-weight: 500;
      white-space: nowrap;
    }

    /* 浮動經驗值獲得提示 (Toast) */
    .exp-toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #0f172a;
      border: 1px solid #38bdf8;
      color: #38bdf8;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 8px 24px rgba(56, 189, 248, 0.25);
      z-index: 100;
      opacity: 0;
      transform: translateY(12px);
      transition: all 0.25s ease;
      pointer-events: none;
    }
    .exp-toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* 榮譽等級 20 階彈窗 (Modal) */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 99;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.show { display: flex; }
    .modal-box {
      background: #131b2c;
      border: 1px solid var(--border);
      border-radius: 12px;
      max-width: 520px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      padding: 20px;
      color: #fff;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }
    .modal-title { font-size: 16px; font-weight: 700; color: #38bdf8; }
    .modal-close {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 18px;
      cursor: pointer;
    }
    .rank-list-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
    }
    .rank-list-table th, .rank-list-table td {
      padding: 8px 10px;
      text-align: left;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .rank-list-table th { color: var(--text-muted); font-weight: 600; }
    .rank-row-active { background: rgba(56, 189, 248, 0.12); color: #38bdf8; font-weight: 700; }

    /* 側邊欄過濾輸入框 */
    .sidebar-filter { position: relative; }
    .sidebar-input {
      width: 100%;
      background: #0b0f17;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 12px;
      color: #fff;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }
    .sidebar-input:focus { border-color: var(--accent); }

    /* 目錄分組 */
    .nav-group-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--text-muted);
      margin: 10px 0 6px 4px;
    }
    .nav-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .nav-item-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 7px 10px;
      border-radius: 6px;
      color: var(--text-sub);
      text-decoration: none;
      font-size: 13px;
      font-weight: 500;
      background: transparent;
      border: none;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s ease;
    }
    .nav-item-btn:hover {
      background: #1b263a;
      color: #fff;
    }
    .nav-item-btn .outlink {
      font-size: 11px;
      color: var(--text-muted);
      opacity: 0;
      transition: opacity 0.15s;
    }
    .nav-item-btn:hover .outlink { opacity: 1; color: var(--accent); }

    /* 右側主要內容區 */
    main.content {
      margin-left: 310px;
      flex: 1;
      padding: 24px 32px 60px;
      min-height: calc(100vh - 48px);
    }

    /* 頂部搜尋與分類按鈕 */
    .header-section { margin-bottom: 24px; }
    .search-row {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }
    .main-search-input {
      flex: 1;
      min-width: 280px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 14px;
      color: #fff;
      outline: none;
      transition: all 0.2s;
    }
    .main-search-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-glow);
    }

    .tabs-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .filter-tab {
      background: var(--bg-card);
      border: 1px solid var(--border);
      color: var(--text-sub);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
    }
    .filter-tab:hover { color: #fff; border-color: var(--accent); }
    .filter-tab.active {
      background: var(--accent);
      color: #0b0f17;
      font-weight: 700;
      border-color: var(--accent);
    }

    /* 卡片網格 */
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(330px, 1fr));
      gap: 18px;
    }
    .site-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-decoration: none;
      color: inherit;
      transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
      position: relative;
    }
    .site-card:hover {
      transform: translateY(-3px);
      border-color: var(--accent);
      box-shadow: 0 8px 24px var(--accent-glow);
      background: var(--bg-card-hover);
    }
    .site-card.target-highlight {
      border-color: #38bdf8 !important;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.35), 0 8px 24px rgba(56, 189, 248, 0.3) !important;
      animation: pulseHighlight 1.5s ease-out;
    }
    @keyframes pulseHighlight {
      0% { transform: scale(1.02); }
      50% { transform: scale(1.02); }
      100% { transform: scale(1); }
    }

    .card-head {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 10px;
      gap: 8px;
    }
    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: #fff;
    }
    .card-actions {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .card-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 4px;
      white-space: nowrap;
    }
    .badge-official { background: rgba(59, 130, 246, 0.2); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
    .badge-realtime { background: rgba(239, 68, 68, 0.2); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
    .badge-finance  { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .badge-news     { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .badge-global   { background: rgba(139, 92, 246, 0.2); color: #a78bfa; border: 1px solid rgba(139, 92, 246, 0.3); }
    .badge-media    { background: rgba(236, 72, 153, 0.2); color: #f472b6; border: 1px solid rgba(236, 72, 153, 0.3); }

    .star-btn {
      background: transparent;
      border: none;
      color: #475569;
      cursor: pointer;
      font-size: 15px;
      line-height: 1;
      padding: 2px;
      transition: color 0.15s;
    }
    .star-btn:hover, .star-btn.active { color: #f59e0b; }

    .card-body {
      font-size: 13px;
      color: var(--text-sub);
      line-height: 1.5;
      margin-bottom: 14px;
      flex-grow: 1;
    }
    .card-foot {
      border-top: 1px dashed var(--border);
      padding-top: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
    }
    .card-feature {
      color: var(--accent);
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .card-open {
      color: var(--text-muted);
      font-size: 11px;
    }
    .site-card:hover .card-open { color: var(--accent); }

    /* 空狀態 */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
      grid-column: 1 / -1;
      display: none;
    }

    /* RWD 漢堡選單 */
    .menu-toggle {
      display: none;
      background: transparent;
      border: 1px solid var(--border);
      color: #fff;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
    }

    @media (max-width: 860px) {
      aside.sidebar {
        transform: translateX(-100%);
        transition: transform 0.25s ease;
      }
      aside.sidebar.open {
        transform: translateX(0);
      }
      main.content {
        margin-left: 0;
        padding: 16px;
      }
      .menu-toggle { display: block; }
    }
  </style>
</head>
<body>

  <!-- 頂部固定狀態列 -->
  <div class="top-bar">
    <div class="top-brand">
      <button class="menu-toggle" id="menuToggle" onclick="toggleSidebar()">☰ 目錄</button>
      <span>🚀 火星人的便當 · 財經資訊導航站</span>
    </div>
    <div class="top-right-group">
      <div class="clocks-wrap">
        <div class="clock-item"><span class="clock-dot"></span> 台北: <span id="clock-tw">--:--:--</span></div>
        <div class="clock-item"><span class="clock-dot" style="background:#38bdf8;"></span> 紐約: <span id="clock-ny">--:--:--</span></div>
      </div>
    </div>
  </div>

  <div class="layout-wrapper">
    <!-- 左側總清單目錄 (Sidebar) -->
    <aside class="sidebar" id="sidebar">
      <!-- 左上角：火星人的便當基地 -->
      <a href="https://vocus.cc/salon/6a80591abc13239b2cad93c5" target="_blank" rel="noopener noreferrer" class="salon-card">
        <div class="salon-badge">🍱 資訊基地 · 方格子</div>
        <div class="salon-title">火星人的便當 <span>↗</span></div>
        <div class="salon-desc">個人文章、產業觀測、市場數據與心得筆記累積處。</div>
      </a>

      <!-- 觀賞者榮譽等級卡片 (Honor Rank System) -->
      <div class="honor-card">
        <div class="honor-header">
          <span class="honor-tag">🎖️ 觀賞者榮譽殿堂</span>
          <button class="honor-btn-rule" onclick="openHonorModal()">查看 20 階 ➔</button>
        </div>
        <div class="honor-rank-row">
          <div class="honor-badge-icon" id="honorBadgeIcon">🌱</div>
          <div class="honor-details">
            <div class="honor-level-title">
              <span class="honor-lvl-num" id="honorLvlNum">Lv.01</span>
              <span id="honorTitle">股市小白</span>
            </div>
            <div class="honor-exp-text">
              經驗值: <span id="honorExpCur">0</span> / <span id="honorExpMax">100</span>
            </div>
          </div>
        </div>
        <div class="honor-progress-bar">
          <div class="honor-progress-fill" id="honorProgressFill"></div>
        </div>
        <div class="honor-action-row">
          <button class="btn-checkin" id="btnCheckin" onclick="dailyCheckIn()">📅 每日簽到 (+30 EXP)</button>
          <div class="btn-read-exp" title="點擊任意網站卡片可自動獲得 +5 EXP">點擊站點 +5</div>
        </div>
      </div>

      <!-- 快速過濾 -->
      <div class="sidebar-filter">
        <input type="text" id="sideFilter" class="sidebar-input" placeholder="🔍 側欄快速搜尋站名..." oninput="filterSidebar(this.value)">
      </div>

      <!-- 分類清單 -->
      <div id="sidebarMenu"></div>
    </aside>

    <!-- 右側主要內容區 (Main Content) -->
    <main class="content">
      <div class="header-section">
        <div class="search-row">
          <input type="text" id="mainSearch" class="main-search-input" placeholder="🔍 搜尋網站名稱、功能或關鍵字（如：Bloomberg、CNBC、WSJ、月營收、VIX、殖利率）...">
        </div>

        <div class="tabs-wrap" id="categoryTabs">
          <button class="filter-tab active" data-cat="all">全部收錄 (23)</button>
          <button class="filter-tab" data-cat="favorites">⭐ 我的常用收藏 (<span id="favCount">0</span>)</button>
          <button class="filter-tab" data-cat="media">📺 國際財經名牌 (6)</button>
          <button class="filter-tab" data-cat="official">🏛️ 官方第一手 (4)</button>
          <button class="filter-tab" data-cat="realtime">⚡ 即時看盤熱度 (4)</button>
          <button class="filter-tab" data-cat="finance">📊 基本面與籌碼 (3)</button>
          <button class="filter-tab" data-cat="news">📰 產業趨勢新聞 (3)</button>
          <button class="filter-tab" data-cat="global">🌐 全球總經美股 (3)</button>
        </div>
      </div>

      <!-- 卡片網格 -->
      <div class="cards-grid" id="cardsGrid"></div>
      <div class="empty-state" id="emptyState">
        <p style="font-size: 16px; margin-bottom: 6px;">查無符合的網站</p>

      let current = honorRanks[0];

      for (let i = honorRanks.length - 1; i >= 0; i--) {
        if (userHonor.totalExp >= honorRanks[i].expReq) {
          current = honorRanks[i];
          next = honorRanks[i + 1] || null;
          break;
        }
      }
      return { current, next };
    }

      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => {

      }, 1600);

      userHonor.totalExp += points;
      saveUserHonor();
      updateHonorUI();
      showExpToast(`+${points} EXP ${reason}！`);

    function updateHonorUI() {
      const { current, next } = getCurrentRank();
      const lvlStr = current.lvl < 10 ? `Lv.0${current.lvl}` : `Lv.${current.lvl}`;
      
      document.getElementById('honorBadgeIcon').innerText = current.icon;
      document.getElementById('honorLvlNum').innerText = lvlStr;
      document.getElementById('honorTitle').innerText = current.name;

      const curExpEl = document.getElementById('honorExpCur');
      const maxExpEl = document.getElementById('honorExpMax');
      const fillEl = document.getElementById('honorProgressFill');

      if (next) {
        const span = next.expReq - current.expReq;
        const progress = userHonor.totalExp - current.expReq;
        const pct = Math.min(100, Math.max(0, (progress / span) * 100));
        curExpEl.innerText = userHonor.totalExp;
        maxExpEl.innerText = next.expReq;
        fillEl.style.width = `${pct}%`;
      } else {
        curExpEl.innerText = userHonor.totalExp;
        maxExpEl.innerText = "MAX";

      }

            html += `
              <li>
                <button class="nav-item-btn" onclick="scrollToSite('${s.id}')">
                  <span>${isFav ? '⭐ ' : ''}${s.name.split(' ')[0]}</span>
                  <a href="${s.url}" target="_blank" rel="noopener noreferrer" class="outlink" onclick="event.stopPropagation(); onSiteClick('${s.name}')">↗</a>
                </button>
              </li>
            `;
          });
          html += `</ul>`;
        }
      });

      menuEl.innerHTML = html;
    }

    function filterSidebar(val) {
      renderSidebarMenu(val);
    }

    // 平滑滾動並高亮卡片
    function scrollToSite(id) {
      if (currentCat !== 'all' && currentCat !== 'favorites') {
        currentCat = 'all';
        document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
        document.querySelector('.filter-tab[data-cat="all"]').classList.add('active');
        renderCards();
      }

      const card = document.getElementById(`card-${id}`);
      if (card) {
        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
        card.classList.add('target-highlight');
        setTimeout(() => {
          card.classList.remove('target-highlight');
        }, 1800);
      }
    }

    // 渲染右側卡片
    let currentCat = 'all';
    let searchQuery = '';

    function renderCards() {
      const grid = document.getElementById('cardsGrid');
      const emptyState = document.getElementById('emptyState');

      const filtered = sites.filter(s => {
        const matchesCat = (currentCat === 'all') || 
                           (currentCat === 'favorites' && favorites.includes(s.id)) || 
                           (s.cat === currentCat);
        const q = searchQuery.toLowerCase().trim();
        const matchesSearch = !q || 
                              s.name.toLowerCase().includes(q) || 
                              s.desc.toLowerCase().includes(q) || 
                              s.feature.toLowerCase().includes(q);
        return matchesCat && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '';
        emptyState.style.display = 'block';
        return;
      }

      emptyState.style.display = 'none';
      grid.innerHTML = filtered.map(s => {
        const isFav = favorites.includes(s.id);
        return `
          <a href="${s.url}" target="_blank" rel="noopener noreferrer" class="site-card" id="card-${s.id}" onclick="onSiteClick('${s.name}')">
            <div>
              <div class="card-head">
                <span class="card-title">${s.name}</span>
                <div class="card-actions">
                  <span class="card-badge ${s.bClass}">${s.badge}</span>
                  <button class="star-btn ${isFav ? 'active' : ''}" onclick="toggleFavorite('${s.id}', event)" title="收藏此站">
                    ${isFav ? '★' : '☆'}
                  </button>
                </div>
              </div>
              <p class="card-body">${s.desc}</p>
            </div>
            <div class="card-foot">
              <span class="card-feature">💡 ${s.feature}</span>
              <span class="card-open">開啟 ↗</span>
            </div>
          </a>
        `;
      }).join('');
    }

    // 事件監聽：搜尋
    document.getElementById('mainSearch').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      renderCards();
    });

    // 事件監聽：分類切換
    document.getElementById('categoryTabs').addEventListener('click', (e) => {
      if (e.target.tagName === 'BUTTON') {
        document.querySelectorAll('.filter-tab').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentCat = e.target.dataset.cat;
        renderCards();
      }
    });

    // 行動版側邊欄開關
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
    }

    // 初始載入
    updateFavCount();
    renderSidebarMenu();
    renderCards();
    updateHonorUI();
  </script>
</body>
</html>
